name: collect

# The clock starts the day this runs for the first time.
#
# The queue is not observable in arrears: a result sitting in review today is
# invisible, and the only way to know the registry looked a particular way on a
# particular morning is to have been there that morning. Every day this job does
# not run is a day that cannot be recovered later, which is why the run log
# treats a gap as evidence rather than as an inconvenience.

on:
  schedule:
    # 07:00 UTC, fixed by prereg.POLL_HOUR_UTC. The registry advances its own
    # data timestamp around 09:00 UTC, so this reads the previous day settled
    # rather than catching a refresh in progress.
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "daily or backfill"
        default: "daily"
        type: choice
        options: ["daily", "backfill"]
      history_budget:
        description: "history calls this run (secondary cap)"
        default: "400"
      history_minutes:
        description: "wall-clock box for the history sweep"
        default: "25"
      run_probe:
        description: "also re-characterise the source"
        type: boolean
        default: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # A collector that hangs on an unresponsive source must not hold the
    # scheduler; tomorrow it runs again and the lookback window covers the gap.
    timeout-minutes: 40
    env:
      EMBARGO_DSN: ${{ secrets.EMBARGO_DSN }}
      EMBARGO_CONTACT: ${{ vars.EMBARGO_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[db]"

      # Until the database exists this job has nothing to do, and a scheduled
      # run that fails every morning teaches everyone to ignore a red mark. It
      # reports not-configured and stops, which is a different thing from
      # succeeding: the run log stays empty and the M0 checklist stays unticked.
      # There is deliberately no migrate step here, and no owner credential in
      # this job. The schema is applied once at deploy time by embargo.bootstrap.
      # A daily workflow holding owner rights could UPDATE or DELETE anything,
      # which would make "the writer role physically cannot restate an
      # observation" a sentence in a README rather than a property of the
      # system. The collector connects as embargo_app and holds INSERT.
      - name: Is there a database yet
        id: check
        run: |
          if [ -z "$EMBARGO_DSN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::EMBARGO_DSN is unset -- nothing collected. See the Deploying section of the README."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect
        if: steps.check.outputs.configured == 'true'
        run: |
          python -m embargo.ingest \
            --job "${{ inputs.job || 'daily' }}" \
            --history-budget "${{ inputs.history_budget || '400' }}"             --history-minutes "${{ inputs.history_minutes || '25' }}"

  probe:
    # The source characterisation, re-run weekly. Its job is to notice when
    # something the design rests on stops being true -- the queue becoming
    # visible, or a posted record ceasing to disclose its wait -- rather than to
    # produce a finding.
    if: github.event_name == 'schedule' || inputs.run_probe
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EMBARGO_CONTACT: ${{ vars.EMBARGO_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e "."
      - run: python -m embargo.probe --sample 120
      - uses: actions/upload-artifact@v4
        with:
          name: source-facts-${{ github.run_id }}
          path: artifacts/source_facts.json
