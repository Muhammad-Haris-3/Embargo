name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: offline suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"

      # Run first and on its own. If the document and the code disagree about a
      # threshold, nothing further is worth running.
      - name: The preregistration binds the code
        run: python -m pytest tests/test_preregistration.py -v

      - name: Full offline suite
        run: python -m pytest

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

  database:
    name: append-only is enforced by the database
    needs: offline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: embargo
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      EMBARGO_ADMIN_DSN: postgresql://postgres:postgres@localhost:5432/embargo
      EMBARGO_DSN: postgresql://postgres:postgres@localhost:5432/embargo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,db]"

      - name: Migrate
        run: python -m embargo.migrate

      - name: Migrating twice changes nothing
        run: python -m embargo.migrate

      # Provision through the same path a deployment uses, rather than hand-
      # rolling a role here. A CI job that creates the role itself tests the
      # grants and leaves bootstrap untested -- which is how `CREATE ROLE ...
      # PASSWORD %s` reached a real database before anyone found out that
      # utility statements do not take bound parameters.
      #
      # The generated password goes to a file and is never echoed. It is a
      # throwaway on a container that dies with the job, and printing it anyway
      # would model exactly the habit this project should not have.
      - name: Provisioning works
        shell: bash
        run: |
          set -o pipefail
          python -m embargo.bootstrap --admin-dsn "$EMBARGO_ADMIN_DSN" > bootstrap.out
          DSN=$(grep -A1 'EMBARGO_DSN secret' bootstrap.out | tail -n1)
          test -n "$DSN"
          echo "::add-mask::$DSN"
          echo "EMBARGO_WRITER_DSN=$DSN" >> "$GITHUB_ENV"
          grep -q 'embargo_app: created' bootstrap.out

      - name: Provisioning twice leaves the passwords alone
        shell: bash
        run: |
          python -m embargo.bootstrap --admin-dsn "$EMBARGO_ADMIN_DSN" > second.out
          grep -q 'embargo_app: unchanged' second.out
          grep -q 'embargo_api: unchanged' second.out

      - name: The forbidden writes are actually attempted
        # pipefail is not optional: without it this step exits with tee's status
        # and a failing suite reads as green.
        shell: bash
        run: |
          set -o pipefail
          python -m pytest tests/test_append_only.py -v -rs | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "::error::append-only tests skipped -- the guarantee went untested"
            exit 1
          fi
