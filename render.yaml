# Render blueprint for the Embargo serving API.

services:
  - type: web
    name: embargo-api
    runtime: python
    plan: free
    # Must match the Neon project's region. The database is in AWS us-east-2,
    # so the API sits in Ohio beside it. Every request this API serves is a
    # database round trip, and splitting them across the Atlantic would add
    # ~100ms to each on an instance that is already cold-starting.
    #
    # The subject matter is American, but the latency that matters is
    # API-to-database. Collection runs in GitHub Actions, not here.
    region: ohio
    buildCommand: pip install -r requirements-serve.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      # Refuses to fall back to a writable DSN. See api.main.reader_dsn.
      - key: EMBARGO_ENV
        value: production
      # Set in the Render dashboard, never here:
      #
      #   EMBARGO_READER_DSN -- the embargo_api role, which holds SELECT and
      #   nothing else.
      #
      # EMBARGO_DSN is deliberately NOT available to this service. If the API
      # held the collector's credentials, the append-only guarantee would rest
      # on the API never choosing to use them, rather than on it being unable
      # to. EMBARGO_ADMIN_DSN is never set anywhere but a maintainer's shell.
